{{- if .Values.azure.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "trail-import-service.fullname" . }}-azure-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trail-import-service.labels" . | nindent 4 }}
  {{- if .Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
  {{- end }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azure.kvCsiClientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: pg-host
          objectType: secret
        - |
          objectName: peaks-hikes-db-user
          objectType: secret
        - |
          objectName: peaks-hikes-db-password
          objectType: secret
{{- end }}