apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trail-import-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trail-import-service.labels" . | nindent 4 }}
  {{- if .Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trail-import-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trail-import-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.azure.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "social-feed-service.fullname" . }}-azure-kv
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.clusterIP.port }}
          {{- if .Values.azure.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -eu
              
              # Read secrets from CSI mounted files 
              export KUMULUZEE_DATASOURCES_DEFAULT_USERNAME=$(cat /mnt/secrets-store/trail-import-db-user)
              export KUMULUZEE_DATASOURCES_DEFAULT_PASSWORD=$(cat /mnt/secrets-store/trail-import-db-password)
              export DB_HOST=$(cat /mnt/secrets-store/pg-host)
              export KUMULUZEE_DATASOURCES_DEFAULT_CONNECTIONURL="jdbc:postgresql://${DB_HOST}:{{ .Values.azure.port }}/{{ .Values.azure.database }}?sslmode={{ .Values.azure.sslmode }}&currentSchema={{ .Values.database.schema }},public"
              

              # JWT Auth (Keycloak / OIDC)
              export KUMULUZEE_JWT_AUTH_ISSUER="{{ .Values.jwtAuth.issuer }}"
              export KUMULUZEE_JWT_AUTH_JWKS_URI="{{ .Values.jwtAuth.jwksUri }}"

              # Run the Java application
              exec java -jar /app/trail-import-service.jar
          {{- end }}
          env:
            - name: KUMULUZEE_ENV_NAME
              value: {{ .Values.environment | default "dev" | quote }}
            - name: KUMULUZEE_SERVER_HTTP_PORT
              value: "{{ .Values.service.clusterIP.port }}"
            - name: KUMULUZEE_SERVER_HTTP_ADDRESS
              value: "{{ .Values.service.clusterIP.address }}"
            {{- if .Values.database.enabled }}

            # JWT Auth (Keycloak / OIDC)
            - name: KUMULUZEE_JWT_AUTH_ISSUER
              value: {{ .Values.jwtAuth.issuer | quote }}
            - name: KUMULUZEE_JWT_AUTH_JWKS_URI
              value: {{ .Values.jwtAuth.jwksUri | quote }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}