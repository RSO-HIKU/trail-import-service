apiVersion: v1
kind: Service
metadata:
  name: {{ include "trail-import-service.fullname" . }}-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trail-import-service.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "trail-import-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.nodePort.port }}
      targetPort: {{ .Values.service.nodePort.port }}
      nodePort: {{ .Values.service.nodePort.nodePort }}
